<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="StudyHub student profile and security settings configuration.">
    <title>StudyHub | Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button class="back-to-top" type="button" aria-label="Back to top"><span aria-hidden="true">↑</span></button>

    <header class="navbar" id="site-navbar">
        <div class="navbar__inner">
            <a class="brand" href="index.html" aria-label="StudyHub home">
                <span class="brand__icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" role="img" aria-hidden="true">
                        <path d="M4.6 13.8h10.7a2 2 0 0 1 2 2v1.5H6.6a2 2 0 0 1-2-2z" fill="#d97706" stroke="#8b5a22" stroke-width="0.7" stroke-linejoin="round"></path>
                        <path d="M5.2 10.6h11a2 2 0 0 1 2 2v1.6H7.2a2 2 0 0 1-2-2z" fill="#ef4444" stroke="#8b1e1e" stroke-width="0.7" stroke-linejoin="round"></path>
                        <path d="M5.8 7.4h11.2a2 2 0 0 1 2 2V11H7.8a2 2 0 0 1-2-2z" fill="#22c55e" stroke="#1f6b3b" stroke-width="0.7" stroke-linejoin="round"></path>
                        <path d="M7 6.6h9.2" fill="none" stroke="#f8fafc" stroke-width="1.1" stroke-linecap="round"></path>
                        <path d="M7 9.1h7.2" fill="none" stroke="#f8fafc" stroke-width="1.1" stroke-linecap="round"></path>
                        <path d="M14.6 4.7l1.5-1.5 3.2 3.2-1.5 1.5-3.9 1.1z" fill="#f59e0b" stroke="#92400e" stroke-width="0.7" stroke-linejoin="round"></path>
                        <path d="M13.6 5.7l3.2 3.2" fill="none" stroke="#78350f" stroke-width="1.2" stroke-linecap="round"></path>
                    </svg>
                </span>
                <span class="brand__text"><strong>StudyHub</strong><small>Cloud-ready LMS</small></span>
            </a>

            <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="primary-navigation"><span></span><span></span><span></span></button>

            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle color theme" aria-pressed="false" title="Toggle color theme">
                <span class="theme-toggle__icon" aria-hidden="true">☀️</span>
                <span class="theme-toggle__label">Light</span>
            </button>

            <nav class="nav" id="primary-navigation" aria-label="Primary navigation">
                <a href="index.html#home">Home</a>
                <a href="course.html">Courses</a>
                <a href="features.html">Features</a>
                <a href="student-dashboard.html">Dashboard</a>
                <a href="profile.html">Profile</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <a class="nav__link nav__link--ghost" href="login.html">Login</a>
                <a class="nav__link nav__link--ghost" href="register.html">Register</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="dashboard-page section">
            <div class="container dashboard-shell">
                <article class="dashboard-hero reveal">
                    <div>
                        <p class="eyebrow" id="settings-eyebrow">Account settings</p>
                        <h1 id="settings-heading">Settings</h1>
                        <p class="hero__description" id="settings-summary">Update your account information, public profile, and password.</p>

                        <div class="dashboard-hero__actions">
                            <a class="button button--secondary" id="back-to-profile" href="profile.html">← Back to Profile</a>
                        </div>
                    </div>
                </article>

                <div class="dashboard-grid">
                    <article class="dashboard-card dashboard-card--wide reveal" style="grid-column: span 12;">
                        <div class="dashboard-card__header">
                            <h2>Security and Settings</h2>
                            <span class="dashboard-tag">Account safe</span>
                        </div>

                        <form class="profile-settings-form" id="profile-settings-form">
                            <div class="profile-settings-grid">
                                <label>
                                    <span>First name</span>
                                    <input type="text" name="firstName" id="settings-first-name" required>
                                </label>
                                <label>
                                    <span>Last name</span>
                                    <input type="text" name="lastName" id="settings-last-name" required>
                                </label>
                                <label>
                                    <span>Email</span>
                                    <input type="email" name="email" id="settings-email" required>
                                </label>
                                <label>
                                    <span>Phone</span>
                                    <input type="tel" name="phone" id="settings-phone" placeholder="+1 555 000 0000">
                                </label>
                                <label class="profile-settings-form__wide">
                                    <span>Profile photo URL</span>
                                    <input type="url" name="profilePicture" id="settings-photo" placeholder="https://...">
                                </label>
                                <label class="profile-settings-form__wide">
                                    <span>Bio</span>
                                    <textarea name="bio" id="settings-bio" rows="3" placeholder="Write a short bio..."></textarea>
                                </label>
                                <label class="profile-settings-form__wide">
                                    <span>Skills</span>
                                    <input type="text" name="skills" id="settings-skills" placeholder="Linux, Git, AWS">
                                </label>
                            </div>

                            <div class="profile-settings-passwords">
                                <label>
                                    <span>Current password</span>
                                    <input type="password" name="currentPassword" id="settings-current-password" placeholder="Enter current password">
                                </label>
                                <label>
                                    <span>New password</span>
                                    <input type="password" name="newPassword" id="settings-new-password" placeholder="Enter new password">
                                </label>
                                <label>
                                    <span>Confirm new password</span>
                                    <input type="password" name="confirmPassword" id="settings-confirm-password" placeholder="Confirm new password">
                                </label>
                            </div>

                            <div class="profile-settings-actions">
                                <button class="button button--primary profile-section__button" type="submit">Save settings</button>
                                <p class="profile-settings-message" id="profile-settings-message" aria-live="polite"></p>
                            </div>
                        </form>
                    </article>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container footer__bottom">
            <p>© <span class="year"></span> StudyHub. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
